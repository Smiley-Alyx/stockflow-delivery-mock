services:
  delivery-mock:
    build:
      context: .
    environment:
      DELIVERY_MOCK_SERVICE_NAME: stockflow-delivery-mock
      DELIVERY_MOCK_HTTP_PORT: 8080
      DELIVERY_MOCK_DEBUG_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: stockflow
      RABBITMQ_PASSWORD: stockflow
      RABBITMQ_VHOST: /
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: stockflow
      RABBITMQ_DEFAULT_PASS: stockflow
    ports:
      - "5674:5672"
      - "15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
